function photoField(slot, label, required) {
  var p = PHOTOS[slot];
  var html = '<div class="f" style="margin-bottom:14px"><span style="display:block;font-size:12.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">' +
    h(label) + (required ? ' <b class="req">*</b>' : ' <span style="text-transform:none;font-weight:600">(optional)</span>') + '</span>';
  if (p && p.preview) {
    html += '<div class="photo-prev"><img src="' + h(p.preview) + '" alt="Photo"><button class="x" data-a="photoClear" data-x="' + slot + '" aria-label="Remove photo">✕</button></div>' +
      (p.busy ? '<div class="photo-busy">Uploading photo…</div>' : '') +
      (p.err ? '<div class="formerr" style="margin-top:8px">' + h(p.err) + ' <button class="btn sec sm" data-a="photoTake" data-x="' + slot + '" style="margin-top:8px">Try again</button></div>' : '');
  } else {

      /* A finished cleaning task is proved with a photo taken there and

/* ---------------------------------------------------------------------
   Page data — fetched when a page needs it, kept while you move around,
   refreshed in the background every 30 seconds.
   --------------------------------------------------------------------- */
var DATA = {}, ERRS = {}, INFLIGHT = {};
function need(key, url) {
  var d = DATA[key];

  var failed = ERRS[key] && ERRS[key].url === url;
  if ((!have || d._stale) && !INFLIGHT[key] && !failed) {
    INFLIGHT[key] = url;
    var page = S.page;
    Api.get(url).then(function (res) {
      res._url = url; DATA[key] = res; delete ERRS[key];
      noteServerTime(res.serverNow);
    }, function (e) {
      if (have) d._stale = false;
      else ERRS[key] = { url: url, msg: e.message };
    }).then(function () {
      delete INFLIGHT[key];
      if (S.page === page) paint();
    });
  }
  if (have) return d;
  if (failed) return { _err: ERRS[key].msg };
  return null;
}
function stale(key) { if (DATA[key]) DATA[key]._stale = true; }
function staleAll() { Object.keys(DATA).forEach(stale); }
function forget(key) { delete DATA[key]; delete ERRS[key]; }
function retry() { ERRS = {}; staleAll(); paint(); }
function loadingHtml(d, what) {
  if (d && d._err) return '<div class="errbox">' + h(d._err) + '<div style="margin-top:10px"><button class="btn sec sm" data-a="retry">Try again</button></div></div>';
  return '<div class="loading">Loading ' + h(what || '') + '…</div>';
}

/* ---------------------------------------------------------------------

/* ---------------------------------------------------------------------
   Notifications — the bell. The server makes them (task sent, checklist
   reminders, labels expiring…); this polls the count and, when the phone
   allows it, also shows new ones as system notifications.
   --------------------------------------------------------------------- */
var NOTIF = { unread: 0, items: null, init: false, timer: null };
function lastShownKey() { return 'bookends.notif.shown.' + (ME ? ME.id : ''); }
function pollNotifications() {
  if (!ME || ME.mustChange) return;
  Api.get('/api/notifications/count').then(function (d) {
    var grew = d.unread > NOTIF.unread;
    NOTIF.unread = d.unread; paintBell();
    if (grew || !NOTIF.init) loadNotifications(NOTIF.init);
    NOTIF.init = true;
  }, function () { });
}
function loadNotifications(announce) {
  return Api.get('/api/notifications?limit=50').then(function (d) {
    NOTIF.items = d.items; NOTIF.unread = d.unread; paintBell();
    if (sheetIs('notifications')) sheetBody(notificationsBody());
    if (announce) systemNotify(d.items);
    else rememberShown(d.items);

    if (announce) { staleAll(); paint(); }
  }, function () { });
}
function rememberShown(items) {

}

  var last = 0; try { last = +localStorage.getItem(lastShownKey()) || 0; } catch (e) { }

  rememberShown(items);

  if (!navigator.serviceWorker || !navigator.serviceWorker.getRegistration) return;
  navigator.serviceWorker.getRegistration().then(function (reg) {
    if (!reg) return;
    fresh.forEach(function (n) {

    });

}

  Notification.requestPermission().then(function (p) {
    if (p === 'granted') { setAlertsPref('on'); toast('Notifications on'); }

}
function notificationsBody() {
  var items = NOTIF.items;

      '<button class="btn sm" data-a="phoneAlerts">Turn on phone alerts</button></div>';

  if (NOTIF.unread) html += '<button class="btn sec" data-a="readAll" style="margin-bottom:12px">Mark all as read</button>';

/* Where a notification (or a deep link) leads. */

/* ---------------------------------------------------------------------
   Router
   --------------------------------------------------------------------- */

  else if (page === 'settings' && S.page !== 'settings') SET_OPEN = '';

}
function render() {
  if (!ME) { renderLogin(); return; }

/* =====================================================================
   SIGNED-OUT SCREENS — sign in, sign up, forgot password, first password

var LOGIN_ERR = '', LOGIN_UID = '', LOGIN_BUSY = false;
function authShell(inner) {
  $('#tabbar').innerHTML = '';

function offlineNote() {

function doLogin() {

var SIGNUP_ERR = '', SIGNUP_DRAFT = { name: '', uid: '', loc: '' }, SIGNUP_BUSY = false;
function renderSignup() {
  var dr = SIGNUP_DRAFT;
  authShell(
    '<div class="card">' +
    '<div class="autht">Create your account</div>' +
    '<div class="auths">Choose your own username and password.</div>' +
    '<label class="f"><span>Your name</span><input class="inp" id="s_name" value="' + h(dr.name) + '" placeholder="e.g. Suresh Patel" autocomplete="name"></label>' +
    '<label class="f"><span>Username</span><input class="inp" id="s_uid" value="' + h(dr.uid) + '" placeholder="e.g. suresh" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">' +
    '<div class="xs muted" style="margin-top:6px">Lower case letters and numbers only. You will sign in with this.</div></label>' +
    '<label class="f"><span>Your restaurant</span><select class="inp" id="s_loc"><option value="">— choose —</option>' +
    LOCATIONS.map(function (L) { return '<option value="' + L.id + '"' + (L.id === dr.loc ? ' selected' : '') + '>' + h(L.name) + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>Password</span><input class="inp" id="s_pw" type="password" placeholder="At least ' + MIN_PW_LEN + ' characters" autocomplete="new-password"></label>' +
    '<label class="f"><span>Type it again</span><input class="inp" id="s_pw2" type="password" autocomplete="new-password"></label>' +
    (SIGNUP_ERR ? '<div class="card" style="background:#fde8e9;border-color:#f7c9cc;margin:0 0 12px"><b class="sm">' + h(SIGNUP_ERR) + '</b></div>' : '') +
    '<button class="btn" id="s_btn" data-a="doSignup">Create account</button>' +
    '</div>' + offlineNote() +
    '<div class="authnote">The Super Admin approves your account and sets what you can do. You can sign in once it is approved.</div>' +
    '<div class="authlinks"><button data-a="backToLogin">I already have an account</button></div>');
  var f = document.getElementById(dr.name ? 's_pw' : 's_name'); if (f) f.focus();
}
function doSignup() {
  if (SIGNUP_BUSY) return;
  var name = val('s_name').trim(), uid = val('s_uid').trim().toLowerCase(), loc = val('s_loc');
  var pw = val('s_pw'), pw2 = val('s_pw2');
  SIGNUP_DRAFT = { name: name, uid: uid, loc: loc };
  function showError(msg) { SIGNUP_ERR = msg; renderSignup(); }
  if (name.length < 2) { showError('Enter your name'); return; }
  if (!/^[a-z0-9]{2,32}$/.test(uid)) { showError('Username: 2 to 32 lower case letters or numbers, no spaces'); return; }
  if (!loc) { showError('Choose your restaurant'); return; }
  if (pw.length < MIN_PW_LEN) { showError('Password must be at least ' + MIN_PW_LEN + ' characters'); return; }
  if (pw !== pw2) { showError('The two passwords do not match'); return; }
  if (pw === DEFAULT_PW) { showError('Please choose something other than ' + DEFAULT_PW); return; }
  SIGNUP_BUSY = true;
  var btn = document.getElementById('s_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  Api.call('POST', '/api/auth/register', { name: name, uid: uid, loc: loc, password: pw, confirmPassword: pw2 }, { noAuth: true })
    .then(function (data) {
      SIGNUP_BUSY = false; SIGNUP_ERR = ''; SIGNUP_DRAFT = { name: '', uid: '', loc: '' };
      LOGIN_UID = data.user.uid;
      authShell('<div class="card center"><div class="b" style="font-size:18px;margin-top:6px">Account created</div>' +
        '<div class="sm muted" style="margin-top:4px">Thanks, ' + h(data.user.name.split(' ')[0]) + '.</div>' +
        '<div class="card" style="margin-top:14px;text-align:left"><div class="xs muted b">YOUR USERNAME</div><div class="b" style="font-size:20px">' + h(data.user.uid) + '</div></div>' +
        '<div class="sm muted">Your account now needs to be approved by the Super Admin. Once it is, sign in with this username and the password you just chose.</div></div>' +
        '<button class="btn" data-a="backToLogin">Back to sign in</button>');
    }, function (err) { SIGNUP_BUSY = false; showError(err.message || 'Could not create the account'); });
}

var FORGOT_ERR = '', FORGOT_BUSY = false;
function renderForgot() {
  authShell(
    '<div class="card">' +
    '<div class="autht">Forgot your password?</div>' +
    '<div class="auths">Enter your username. The Super Admin will set a temporary password for you.</div>' +

    (FORGOT_ERR ? '<div class="card" style="background:#fde8e9;border-color:#f7c9cc;margin:0 0 12px"><b class="sm">' + h(FORGOT_ERR) + '</b></div>' : '') +
    '<button class="btn" id="f_btn" data-a="doForgot">Ask for a new password</button></div>' +

    '<div class="authlinks"><button data-a="backToLogin">Back to sign in</button></div>');
  var f = document.getElementById('f_uid'); if (f) f.focus();
}
function doForgot() {
  if (FORGOT_BUSY) return;
  var uid = val('f_uid').trim().toLowerCase();
  if (!uid) { FORGOT_ERR = 'Enter your username'; renderForgot(); return; }
  FORGOT_BUSY = true;
  var btn = document.getElementById('f_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  Api.call('POST', '/api/auth/forgot', { uid: uid }, { noAuth: true }).then(function (data) {

      '<button class="btn" data-a="backToLogin">Back to sign in</button>');

}

var PW_ERR = '', PW_BUSY = false;
/* Where the password form is: 'force' (first sign-in), 'sheet' (pop-up) or 'inline' (Settings page). */
var PW_MODE = 'sheet';
function renderSetPassword() {
  authShell(
    '<div class="card">' +
    '<div class="autht">Choose your password</div>' +
    '<div class="auths">' + h(ME.name) + ' · ID ' + h(ME.uid) + '</div>' +
    '<label class="f"><span>New password</span><input class="inp" id="p_new" type="password" placeholder="At least ' + MIN_PW_LEN + ' characters" autocomplete="new-password"></label>' +
    '<label class="f"><span>Type it again</span><input class="inp" id="p_new2" type="password" autocomplete="new-password"></label>' +
    (PW_ERR ? '<div class="card" style="background:#fde8e9;border-color:#f7c9cc;margin:0 0 12px"><b class="sm">' + h(PW_ERR) + '</b></div>' : '') +
    '<button class="btn" id="p_btn" data-a="savePw">Save and continue</button></div>' +
    '<div class="authnote">Replace the starting password before you use the app. Keep it to yourself — everything you do is recorded under your name.</div>' +
    '<div class="authlinks"><button data-a="logout">Sign in as someone else</button></div>');
}
function changePwSheet() {
  closePop();
  openSheet('Change your password',
    '<div class="card">' +
    '<label class="f"><span>Current password</span><input class="inp" id="p_cur" type="password" autocomplete="current-password"></label>' +
    '<label class="f"><span>New password</span><input class="inp" id="p_new" type="password" placeholder="At least ' + MIN_PW_LEN + ' characters" autocomplete="new-password"></label>' +
    '<label class="f"><span>Type it again</span><input class="inp" id="p_new2" type="password" autocomplete="new-password"></label>' +
    (PW_ERR ? '<div class="formerr">' + h(PW_ERR) + '</div>' : '') +
    '<button class="btn" id="p_btn" data-a="savePwSheet">Save new password</button></div>', 'password');
}
function savePw(force) {
  if (PW_BUSY) return;
  var a = val('p_new'), b = val('p_new2'), cur = val('p_cur');
  var mode = force === true ? 'force' : force === 'inline' ? 'inline' : 'sheet';
  PW_MODE = mode;
  function showError(msg) { PW_ERR = msg; if (mode === 'force') renderSetPassword(); else if (mode === 'inline') { paint(); window.scrollTo(0, document.body.scrollHeight); } else changePwSheet(); }
  if (a.length < MIN_PW_LEN) { showError('Password must be at least ' + MIN_PW_LEN + ' characters'); return; }
  if (a !== b) { showError('The two passwords do not match'); return; }
  if (a === DEFAULT_PW) { showError('Please choose something other than ' + DEFAULT_PW); return; }
  PW_BUSY = true;
  var btn = document.getElementById('p_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  Auth.changePassword(cur, a, b).then(function () {
    PW_BUSY = false; PW_ERR = '';
    if (mode === 'force') { S.page = homePage(); render(); startPolling(); } else if (mode === 'inline') { SET_OPEN = ''; paint(); } else { closeSheet(); render(); }
    toast('Password updated');
  }, function (err) { PW_BUSY = false; showError(err.message || 'Could not change your password'); });
}
</script>
<script>
/* =====================================================================
   DASHBOARD (Admin) — all 8 restaurants, the ones that need attention first
   ===================================================================== */
PAGES.dashboard = function () {
  var d = need('dashboard', '/api/dashboard');
  var td = istDate(now());
  var html = pageHead('Dashboard', 'Today, ' + WDAY[td.getUTCDay()] + ' ' + td.getUTCDate() + ' ' + MON[td.getUTCMonth()] + ' · all 8 restaurants');
  if (!d || d._err) return html + loadingHtml(d, 'the overview');
  var T = d.totals;
  var needs = d.restaurants.filter(function (r) { return r.attention === 'high'; }).length;

  html += '<div class="dgroups">' +
    '<div class="dgroup"><div class="dg-t">Cleaning tasks</div><div class="dg-n">' +
    tile(T.tasks.pending, 'Pending', T.tasks.pending ? '' : 'ok', 'tasks', 'PENDING') +
    tile(T.tasks.overdue, 'Overdue', T.tasks.overdue ? 'bad' : 'ok', 'tasks', 'OVERDUE') +
    tile(T.tasks.doneToday, 'Done today', 'ok', 'tasks', 'DONE') + '</div></div>' +
    '<div class="dgroup"><div class="dg-t">Checklists today</div><div class="dg-n">' +
    tile(T.checklists.SUBMITTED, 'Submitted', 'ok', 'checklist', 'SUBMITTED') +
    tile(T.checklists.PENDING, 'Pending', '', 'checklist', 'PENDING') +
    tile(T.checklists.MISSED, 'Missed', T.checklists.MISSED ? 'bad' : 'ok', 'checklist', 'MISSED') + '</div></div>' +
    '<div class="dgroup"><div class="dg-t">Labels</div><div class="dg-n">' +
    tile(T.labels.ACTIVE, 'Active', 'ok', 'labeling', 'ACTIVE') +
    tile(T.labels.EXPIRING, 'Expiring soon', T.labels.EXPIRING ? 'warn' : 'ok', 'labeling', 'EXPIRING') +
    tile(T.labels.EXPIRED, 'Expired', T.labels.EXPIRED ? 'bad' : 'ok', 'labeling', 'EXPIRED') + '</div></div>' +
    '</div>';

  html += '<div class="sec-t">Restaurants' + (needs ? ' · ' + plural(needs, 'needs', 'need') + ' attention' : ' · all on track') + '</div>' +
    '<div class="rgrid">' + d.restaurants.map(function (r) {
      return '<div class="rcard ' + r.attention + '">' +
        '<div class="row"><div class="grow"><h3>' + h(r.name) + '</h3><div class="city">' + h(r.city) + ' · ' + h(r.code) + '</div></div>' +
        (r.attention === 'high' ? st('Needs attention', 'bad') : r.attention === 'low' ? st('Check', 'warn') : st('On track', 'ok')) + '</div>' +
        '<div class="why">' + (r.reasons.length ? h(r.reasons.join(' · ')) : 'Nothing waiting') + '</div>' +
        '<div class="rnums">' +
        '<div><b' + (r.tasks.overdue ? ' style="color:#c4262e"' : '') + '>' + r.tasks.pending + '</b><span>Pending tasks</span></div>' +
        '<div><b>' + r.tasks.doneToday + '</b><span>Done today</span></div>' +
        '<div><b' + (r.labels.EXPIRED ? ' style="color:#c4262e"' : r.labels.EXPIRING ? ' style="color:#b06a00"' : '') + '>' + (r.labels.EXPIRED + r.labels.EXPIRING) + '</b><span>Labels to check</span></div>' +
        '</div>' +
        '<div class="rck">' + r.checklists.map(function (c) {
          var s = c.status === 'PENDING' && c.open ? 'OPEN' : c.status;
          return '<span class="xs b" style="display:inline-flex;align-items:center;gap:5px">' + h(c.label.replace(' Checklist', '')) + ' ' + ckBadge(s) + '</span>';
        }).join('') + (r.checklists.length ? '' : '<span class="xs b muted">No checklist has opened yet today</span>') + '</div>' +
        '<div class="rbtns">' +
        '<button class="btn sec" data-a="dashGo" data-x="checklist" data-l="' + r.id + '">Checklists</button>' +
        '<button class="btn sec" data-a="dashGo" data-x="labeling" data-l="' + r.id + '">Labels</button></div>' +
        '</div>';
    }).join('') + '</div>';
  return html;
};
function tile(n, label, kind, page, filter) {
  if (page === 'tasks') return '<div class="tile ' + (kind || '') + '"><b>' + n + '</b><span>' + h(label) + '</span></div>';
  return '<button class="tile ' + (kind || '') + '" data-a="tileGo" data-x="' + page + '" data-f="' + filter + '"><b>' + n + '</b><span>' + h(label) + '</span></button>';
}
/* From the dashboard into a page, already filtered. */
function dashGo(page, loc, filter) {
  if (page === 'tasks') { S.taskLoc = loc || ''; if (filter) S.taskView = filter; }
  if (page === 'checklist') { S.ckTab = 'board'; S.ckLoc = loc || ''; S.ckDate = todayYmd(); S.ckType = ''; S.ckStatus = filter || ''; }
  if (page === 'labeling') { S.labLoc = loc || ''; S.labStatus = filter || ''; S.labQ = ''; }
  go(page);
}

/* =====================================================================
   CLEANING TASK
   Admin: create and send, see every restaurant's tasks and their photos.
   User: see their restaurant's tasks, add a photo, Mark as Done.
   ===================================================================== */
/* Admin: only allocation — the form, right on the page.
   Location Manager: their restaurant's tasks, to complete with a photo. */
PAGES.tasks = function () {
  if (isAdmin()) return taskAllocatePage();
  var view = S.taskView === 'DONE' ? 'DONE' : 'PENDING';
  var d = need('tasks', '/api/tasks');
  var html = pageHead('Cleaning Task', lname(ME.loc));
  var all = d && d.tasks ? d.tasks : [];
  var pending = all.filter(function (t) { return t.status === 'PENDING'; });
  var done = all.filter(function (t) { return t.status === 'DONE'; });
  html += chips('taskView', [['PENDING', 'To do ' + pending.length], ['DONE', 'Completed ' + done.length]], view);
  if (!d || d._err) return html + loadingHtml(d, 'tasks');
  var list = view === 'DONE' ? done : pending;
  if (!list.length) {
    return html + '<div class="empty"><div class="b" style="font-size:17px">' +
      (view === 'DONE' ? 'No completed tasks yet' : 'Nothing to do right now') + '</div>' +
      '<div class="sm">New tasks from the admin will appear here.</div></div>';
  }
  return html + '<div class="items">' + list.map(taskItem).join('') + '</div>';
};
function taskItem(t) {
  var od = isOverdue(t);
  var photo = t.completionPhotoUrl || t.refPhotoUrl;
  var meta = t.status === 'DONE'
    ? 'Done ' + whenDay(t.completedAt) + ' by ' + (t.completedByName || '—')
    : (od ? 'Was due ' + whenDay(t.dueAt) + ' · overdue' : 'Due ' + whenDay(t.dueAt));
  return '<button class="item' + (od ? ' bad' : '') + '" data-a="openTask" data-x="' + t.id + '">' +
    (photo ? '<img class="ph" src="' + h(photo) + '" alt="" loading="lazy">' : '<span class="ph none">' + ic('clean') + '</span>') +
    '<span class="tx"><span class="tt">' + h(t.title) + '</span>' +
    '<span class="mt" style="display:block">' + (isAdmin() ? h(t.restaurant) + ' · ' : '') + h(meta) + '</span></span>' +
    '<span class="rt">' + taskBadge(t) + '</span></button>';
}

/* ---------- allocate a task (Admin) ----------
   The draft lives in TASK_DRAFT and is kept up to date as the admin types,
   so the page can be redrawn (the 30-second refresh) without losing it. */
var TASK_ERR = '', TASK_DRAFT = null;
function freshTaskDraft() { return { title: '', loc: '', instructions: '', due: dayValue(now()) }; }
function taskAllocatePage() {
  var draft = TASK_DRAFT || (TASK_DRAFT = freshTaskDraft());
  if (isReadOnly()) return pageHead('Cleaning Task') + '<div class="card sm">Your account is view-only, so it cannot send tasks.</div>';
  return pageHead('Cleaning Task', 'Allocate a cleaning task to a restaurant') +
    '<div class="card">' +
    (TASK_ERR ? '<div class="formerr">' + h(TASK_ERR) + '</div>' : '') +
    '<label class="f"><span>Task name <b class="req">*</b></span><input class="inp" id="t_title" maxlength="120" value="' + h(draft.title) + '" placeholder="e.g. Deep clean the walk-in chiller"></label>' +
    '<label class="f"><span>Restaurant <b class="req">*</b></span><select class="inp" id="t_loc">' + locOptions(draft.loc, '— Choose the restaurant —') + '</select></label>' +
    '<label class="f"><span>Cleaning instructions</span><textarea class="inp" id="t_instr" maxlength="2000" placeholder="What needs to be done, step by step">' + h(draft.instructions) + '</textarea></label>' +
    '<label class="f"><span>Due date <b class="req">*</b></span><input class="inp" type="date" id="t_due" min="' + dayValue(now()) + '" value="' + h(draft.due) + '"></label>' +
    '<button class="btn" id="t_send" data-a="sendTask">Send Task</button>' +
    '<div class="hint center" style="margin-top:10px">The restaurant\'s location manager gets a notification straight away.</div>' +
    '</div>';
}
function taskDraft() { return { title: val('t_title'), loc: val('t_loc'), instructions: val('t_instr'), due: val('t_due') }; }
function sendTask() {
  var dr = TASK_DRAFT = taskDraft();
  function stop(msg) { TASK_ERR = msg; paint(); window.scrollTo(0, 0); }
  if (!dr.title.trim()) return stop('Enter the task name.');
  if (!dr.loc) return stop('Choose the restaurant.');
  var dueMs = parseInput(dayEnd(dr.due));
  if (!dueMs) return stop('Choose the due date.');
  if (dueMs < now()) return stop('That due date has already passed.');
  var btn = document.getElementById('t_send'); if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  Api.post('/api/tasks', { title: dr.title, loc: dr.loc, instructions: dr.instructions, due: dayEnd(dr.due) })
    .then(function (res) {
      TASK_ERR = ''; TASK_DRAFT = null;
      forget('dashboard');
      paint();
      /* No pop-up to dismiss: a short message, and the form is ready for the next task. */
      toast('Task sent to ' + res.task.restaurant);
    }, function (err) { stop(err.message); });
}

/* ---------- one task ---------- */
var TASK_OPEN = null, DONE_ERR = '';
function openTask(id) {
  TASK_OPEN = id; DONE_ERR = '';
  delete PHOTOS.taskDone;
  openSheet('Cleaning task', '<div class="loading">Loading…</div>', 'task');
  Api.get('/api/tasks/' + encodeURIComponent(id)).then(function (res) {
    if (TASK_OPEN !== id || !sheetIs('task')) return;
    TASK_OPEN = res.task; drawTaskSheet();
  }, function (err) { sheetBody('<div class="errbox">' + h(err.message) + '</div>'); });
}
function drawTaskSheet() {
  var t = TASK_OPEN; if (!t || typeof t !== 'object') return;
  var canDo = t.status === 'PENDING' && !isReadOnly();
  var html = '<div class="card">' +
    '<div class="row" style="align-items:flex-start;margin-bottom:12px"><div class="grow"><div class="b" style="font-size:19px;line-height:1.25">' + h(t.title) + '</div>' +
    '<div class="sm muted b">' + h(t.restaurant) + '</div></div>' + taskBadge(t) + '</div>' +
    '<div class="kv2">' +
    '<div><div class="k">Due</div><div class="v"' + (isOverdue(t) ? ' style="color:#c4262e"' : '') + '>' + h(whenDay(t.dueAt)) + '</div></div>' +
    '<div><div class="k">Sent by</div><div class="v">' + h(t.createdByName || '—') + ' · ' + h(whenDay(t.createdAt)) + '</div></div>' +
    (t.status === 'DONE' ? '<div><div class="k">Completed</div><div class="v">' + h(whenDay(t.completedAt)) + '</div></div>' +
      '<div><div class="k">Completed by</div><div class="v">' + h(t.completedByName || '—') + '</div></div>' : '') +
    '</div>' +
    (t.instructions ? '<div class="k xs muted b" style="text-transform:uppercase;letter-spacing:.5px">Cleaning instructions</div><div style="white-space:pre-wrap;font-size:15px;margin:4px 0 12px">' + h(t.instructions) + '</div>' : '') +
    (t.refPhotoUrl ? '<div class="xs muted b" style="text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Reference photo</div><img class="shot" src="' + h(t.refPhotoUrl) + '" alt="Reference photo" data-a="viewPhoto" data-x="' + h(t.refPhotoUrl) + '" data-n="Reference · ' + h(t.title) + '">' : '') +
    '</div>';
  if (t.status === 'DONE') {
    html += '<div class="card"><div class="b" style="margin-bottom:8px">Completion photo</div>' +
      (t.completionPhotoUrl ? '<img class="shot" src="' + h(t.completionPhotoUrl) + '" alt="Completion photo" data-a="viewPhoto" data-x="' + h(t.completionPhotoUrl) + '" data-n="Done · ' + h(t.title) + ' · ' + h(t.restaurant) + '">' : '') +
      (t.completionNote ? '<div style="margin-top:10px;font-size:15px"><b>Note:</b> ' + h(t.completionNote) + '</div>' : '') + '</div>';
  } else if (canDo) {
    html += '<div class="card"><div class="b" style="font-size:17px;margin-bottom:10px">Finish this task</div>' +
      (DONE_ERR ? '<div class="formerr">' + h(DONE_ERR) + '</div>' : '') +
      '<div id="d_photo">' + photoField('taskDone', 'Photo of the finished work', true) + '</div>' +
      '<label class="f"><span>Note (optional)</span><input class="inp" id="d_note" maxlength="500" placeholder="Anything the admin should know"></label>' +
      '<button class="btn ok" id="d_btn" data-a="markDone"' + (photoReady('taskDone') ? '' : ' disabled') + '>✓ Mark as Done</button>' +
      (photoReady('taskDone') ? '' : '<div class="hint center" style="margin-top:8px">Take the photo first — then Mark as Done.</div>') +
      '</div>';
  }
  var note = document.getElementById('d_note'), keep = note ? note.value : '';
  sheetBody(html);
  if (keep) { var n2 = document.getElementById('d_note'); if (n2) n2.value = keep; }
}
function markDone() {
  var t = TASK_OPEN;
  if (!photoReady('taskDone')) { DONE_ERR = 'Take a photo of the finished work first.'; drawTaskSheet(); return; }
  var btn = document.getElementById('d_btn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  Api.post('/api/tasks/' + t.id + '/complete', { photoId: PHOTOS.taskDone.id, note: val('d_note') }).then(function (res) {
    delete PHOTOS.taskDone; DONE_ERR = '';
    TASK_OPEN = res.task; drawTaskSheet();
    forget('tasks'); paint();
    toast('Marked as done — the admin has been told');
  }, function (err) { DONE_ERR = err.message; drawTaskSheet(); });
}

/* =====================================================================
   CHECKLIST — Lunch 12:00–1:30 PM, Dinner 5:00–6:00 PM, Closing 10:00 PM–1:00 AM
   User: fill in what is open. Admin: see every restaurant's submissions,
   and add, edit or remove the items each checklist asks.
   ===================================================================== */
var CK_TYPES = [['LUNCH', 'Lunch'], ['DINNER', 'Dinner'], ['CLOSING', 'Closing']];
var CKD = {};          // type -> { shift, done: { itemId: true }, err }

PAGES.checklist = function () { return isAdmin() ? ckAdminPage() : ckUserPage(); };

/* ---------- user: the three checklists ---------- */
function ckUserPage() {
  var d = need('ckStatus', '/api/checklists/status');
  var items = need('ckItems', '/api/checklists/items');
  var html = pageHead('Checklist', lname(ME.loc) + ' · times are IST');
  if (!d || d._err || !items || items._err) return html + loadingHtml(d && d._err ? d : items, 'checklists');
  html += '<div class="ckcards">' + d.windows.map(function (w) {
    var win = CHKW.byType(w.type);
    var sub = w.submission || (w.submissions || []).filter(function (s) { return s.loc === ME.loc; })[0];
    var count = items.items.filter(function (i) { return i.type === w.type; }).length;
    var status, body;
    if (sub) {
      status = ckBadge('SUBMITTED');
      body = '<div class="sm">Submitted by <b>' + h(sub.userName) + '</b> at ' + h(clock(sub.submittedAt)) + '</div>' +
        '<button class="btn sec" data-a="ckRecord" data-x="' + sub.id + '">View</button>';
    } else if (w.open) {
      status = ckBadge('OPEN');
      body = '<div class="sm b">Closes at ' + h(clock(w.endsAt)) + ' · ' + span(w.endsAt - now()) + ' left</div>' +
        '<button class="btn" data-a="ckFill" data-x="' + w.type + '">Open checklist</button>';
    } else if (now() >= w.endsAt) {
      status = ckBadge('MISSED');
      body = '<div class="sm">Not submitted. Opens again ' + h(when(w.nextOpensAt)) + '.</div>';
    } else {
      status = ckBadge('PENDING');
      body = '<div class="sm">Opens ' + h(when(w.nextOpensAt || w.startsAt)) + '</div>';
    }
    return '<div class="ckcard' + (w.open && !sub ? ' open' : '') + '">' +
      '<div class="row"><h3 class="grow">' + h(win.label.replace(' Checklist', '')) + '</h3>' + status + '</div>' +
      '<div class="when">' + CHKW.fmtMinutes(win.start) + ' – ' + CHKW.fmtMinutes(win.end) + (w.type === 'CLOSING' ? ' (next day)' : '') + ' · ' + plural(count, 'item') + '</div>' +
      body + '</div>';
  }).join('') + '</div>';

  var rec = need('ckMine', '/api/checklists?from=' + CHKW.addDaysYmd(todayYmd(), -6) + '&to=' + todayYmd());
  html += '<div class="sec-t">Last 7 days</div>';
  if (!rec || rec._err) return html + loadingHtml(rec, 'history');
  if (!rec.checklists.length) return html + '<div class="card sm muted">Nothing submitted in the last 7 days.</div>';
  return html + '<div class="items">' + rec.checklists.map(ckRecordItem).join('') + '</div>';
}
function ckRecordItem(c) {
  return '<button class="item" data-a="ckRecord" data-x="' + c.id + '"><span class="tx"><span class="tt">' + h(CHKW.byType(c.type).label) + '</span>' +
    '<span class="mt" style="display:block">' + h(dayLabel(c.shiftDate)) + ' · ' + (isAdmin() ? h(lname(c.loc)) + ' · ' : '') + 'by ' + h(c.userName) + ' at ' + h(clock(c.submittedAt)) +
    (c.total != null ? ' · ' + c.ticked + '/' + c.total + ' ticked' : '') + (c.photos ? ' · ' + plural(c.photos, 'photo') : '') + '</span></span>' +
    '<span class="rt">' + ckBadge('SUBMITTED') + '</span></button>';
}

/* ---------- user: filling one in ---------- */
function ckDraft(type) {
  var w = CHKW.windowState(CHKW.byType(type), now());
  var d = CKD[type];
  if (!d || d.shift !== w.shiftDate) d = CKD[type] = { shift: w.shiftDate, done: {}, err: '' };
  return d;
}
function openChecklistFill(type, fromReminder) {
  var w = CHKW.windowState(CHKW.byType(type), now());
  if (!w.open) {
    if (fromReminder) toast(CHKW.byType(type).label + ' opens at ' + CHKW.fmtMinutes(CHKW.byType(type).start));
    return;
  }
  var st = DATA.ckStatus && DATA.ckStatus.windows && DATA.ckStatus.windows.filter(function (x) { return x.type === type; })[0];
  if (st && st.submission) { if (fromReminder) toast('Already submitted'); return; }
  Api.get('/api/checklists/items?type=' + type).then(function (res) {
    var d = ckDraft(type);
    d.items = res.items;
    openSheet(CHKW.byType(type).label, '', 'ckFill');
    drawFill(type);
  }, function (err) { showNotice('Could not open the checklist', h(err.message)); });
}
function drawFill(type) {
  var d = ckDraft(type), items = d.items || [];
  var w = CHKW.windowState(CHKW.byType(type), now());
  var req = items.filter(function (i) { return i.required; });
  var reqDone = req.filter(function (i) { return d.done[i.id]; }).length;
  var photoNeeded = items.filter(function (i) { return i.photoRequired; });
  var photosDone = photoNeeded.filter(function (i) { return photoReady('ck:' + i.id); }).length;
  var html = '<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
    '<div class="grow"><div class="b">' + h(lname(ME.loc)) + '</div><div class="sm muted b">Closes at ' + h(clock(w.endsAt)) + ' · ' + span(w.endsAt - now()) + ' left</div></div>' +
    '<div class="b" style="font-size:18px">' + reqDone + ' / ' + req.length + '<div class="xs muted">done</div></div></div>' +
    (d.err ? '<div class="formerr">' + h(d.err) + '</div>' : '') +
    '<div class="card pad0">' + items.map(function (it) {
      var on = !!d.done[it.id];
      var slot = 'ck:' + it.id, p = PHOTOS[slot];
      return '<div class="cki' + (on ? ' on' : '') + '">' +
        '<button class="box" data-a="ckTick" data-x="' + it.id + '" data-t="' + type + '" role="checkbox" aria-checked="' + on + '" aria-label="' + h(it.text) + '">' + (on ? '✓' : '') + '</button>' +
        '<div class="q"><span data-a="ckTick" data-x="' + it.id + '" data-t="' + type + '">' + h(it.text) + '</span>' +
        (it.photoRequired ? (p && p.preview
          ? '<img class="pthumb" src="' + h(p.preview) + '" alt="Photo">' + (p.busy ? '<div class="photo-busy">Uploading…</div>' : p.err ? '<div class="ck-err">' + h(p.err) + '</div>' : '') +
            '<button class="btn sec pbtn" data-a="ckPhoto" data-x="' + it.id + '" data-t="' + type + '">Retake photo</button>'
          : '<button class="btn pbtn" data-a="ckPhoto" data-x="' + it.id + '" data-t="' + type + '">' + ic('camera').replace('<svg', '<svg style="width:18px;height:18px;fill:#fff"') + ' Add photo</button>') : '') +
        '</div></div>';
    }).join('') + '</div>' +
    (photoNeeded.length ? '<div class="sm muted b center" style="margin:-4px 0 10px">Photos: ' + photosDone + ' of ' + photoNeeded.length + '</div>' : '') +
    '<button class="btn ok" id="ck_send" data-a="ckSubmit" data-x="' + type + '">Submit checklist</button>';
  var sheet = document.querySelector('#modal .sheet'), y = sheet ? sheet.scrollTop : 0;
  sheetBody(html);
  if (sheet) sheet.scrollTop = y;
}
function ckSubmit(type) {
  var d = ckDraft(type), items = d.items || [];
  var missing = items.filter(function (i) { return i.required && !d.done[i.id]; });
  var noPhoto = items.filter(function (i) { return i.photoRequired && !photoReady('ck:' + i.id); });
  var busy = items.some(function (i) { return photoBusy('ck:' + i.id); });
  if (missing.length) { d.err = 'Tick every required item first. ' + plural(missing.length, 'item is', 'items are') + ' still to do.'; drawFill(type); return scrollSheetTop(); }
  if (busy) { d.err = 'Wait for the photos to finish uploading.'; drawFill(type); return scrollSheetTop(); }
  if (noPhoto.length) { d.err = 'Add the required photos first. ' + plural(noPhoto.length, 'photo is', 'photos are') + ' missing.'; drawFill(type); return scrollSheetTop(); }
  var btn = document.getElementById('ck_send'); if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }
  Api.post('/api/checklists', { type: type, items: items.map(function (i) {
    var p = PHOTOS['ck:' + i.id];
    return { id: i.id, done: !!d.done[i.id], photoId: p && p.id ? p.id : undefined };
  }) }).then(function () {
    items.forEach(function (i) { delete PHOTOS['ck:' + i.id]; });
    delete CKD[type];
    closeSheet(); forget('ckStatus'); forget('ckMine'); paint();
    showNotice('Checklist submitted', 'Thank you. The ' + h(CHKW.byType(type).label) + ' for ' + h(lname(ME.loc)) + ' has been sent to the admin.');
  }, function (err) {
    if (err.code === 'ALREADY_SUBMITTED') { closeSheet(); forget('ckStatus'); paint(); showNotice('Already submitted', h(err.message)); return; }
    d.err = err.message; drawFill(type); scrollSheetTop();
  });
}
function scrollSheetTop() { var s = document.querySelector('#modal .sheet'); if (s) s.scrollTop = 0; }

/* ---------- one submitted checklist, with its photos ---------- */
function openChecklistRecord(id) {
  openSheet('Checklist', '<div class="loading">Loading…</div>', 'ckRecord');
  Api.get('/api/checklists/' + encodeURIComponent(id)).then(function (res) {
    var c = res.checklist;
    var answers = c.answers || [];
    sheetBody('<div class="card"><div class="row" style="align-items:flex-start"><div class="grow"><div class="b" style="font-size:18px">' + h(CHKW.byType(c.type).label) + '</div>' +
      '<div class="sm muted b">' + h(lname(c.loc)) + ' · ' + h(dayLabel(c.shiftDate)) + '</div></div>' + ckBadge('SUBMITTED') + '</div>' +
      '<div class="kv2" style="margin-top:12px"><div><div class="k">Submitted by</div><div class="v">' + h(c.userName) + '</div></div>' +
      '<div><div class="k">Submitted at</div><div class="v">' + h(when(c.submittedAt)) + '</div></div>' +
      (c.total != null ? '<div><div class="k">Items ticked</div><div class="v">' + c.ticked + ' of ' + c.total + '</div></div>' : '') +
      '<div><div class="k">Photos</div><div class="v">' + (c.photos || 0) + '</div></div></div></div>' +
      '<div class="card pad0">' + (answers.length ? answers.map(function (a) {
        return '<div class="cki' + (a.done ? ' on' : '') + '"><span class="box" aria-hidden="true">' + (a.done ? '✓' : '') + '</span>' +
          '<div class="q">' + h(a.question) + (a.done ? '' : ' <small><span class="req">Not ticked</span></small>') +
          (a.photoUrl ? '<img class="pthumb" style="width:120px;height:120px;cursor:zoom-in" src="' + h(a.photoUrl) + '" alt="Photo" data-a="viewPhoto" data-x="' + h(a.photoUrl) + '" data-n="' + h(a.question) + '">' : '') +
          '</div></div>';
      }).join('') : '<div class="sm muted" style="padding:14px">No item details were recorded.</div>') + '</div>');
  }, function (err) { sheetBody('<div class="errbox">' + h(err.message) + '</div>'); });
}

/* ---------- admin: submissions and items ---------- */
function ckAdminPage() {
  var html = pageHead('Checklist', 'Lunch 12:00–1:30 PM · Dinner 5:00–6:00 PM · Closing 10:00 PM–1:00 AM (IST)');
  html += chips('ckTab', [['board', 'Submissions'], ['items', 'Checklist items']], S.ckTab);
  return html + (S.ckTab === 'items' ? ckItemsManager() : ckBoard());
}
function ckBoard() {
  if (!S.ckDate) S.ckDate = todayYmd();
  var q = '?from=' + S.ckDate + '&to=' + S.ckDate + (S.ckLoc ? '&loc=' + S.ckLoc : '') + (S.ckType ? '&type=' + S.ckType : '');
  var d = need('ckBoard', '/api/checklists/board' + q);
  var html = '<div class="filters">' +
    '<input class="inp" type="date" id="f_ckDate" value="' + h(S.ckDate) + '" max="' + todayYmd() + '" aria-label="Date">' +
    '<select class="inp" id="f_ckLoc" aria-label="Restaurant">' + locOptions(S.ckLoc, 'All 8 restaurants') + '</select>' +
    '<select class="inp" id="f_ckType" aria-label="Checklist"><option value="">All checklists</option>' +
    CK_TYPES.map(function (t) { return '<option value="' + t[0] + '"' + (S.ckType === t[0] ? ' selected' : '') + '>' + t[1] + '</option>'; }).join('') + '</select></div>';
  if (!d || d._err) return html + loadingHtml(d, 'submissions');
  var c = d.counts;
  html += '<div class="tiles">' +
    '<button class="tile ok' + (S.ckStatus === 'SUBMITTED' ? ' on' : '') + '" data-a="ckStatus" data-x="SUBMITTED"><b>' + c.SUBMITTED + '</b><span>Submitted</span></button>' +
    '<button class="tile' + (S.ckStatus === 'PENDING' ? ' on' : '') + '" data-a="ckStatus" data-x="PENDING"><b>' + c.PENDING + '</b><span>Pending</span></button>' +
    '<button class="tile ' + (c.MISSED ? 'bad' : 'ok') + (S.ckStatus === 'MISSED' ? ' on' : '') + '" data-a="ckStatus" data-x="MISSED"><b>' + c.MISSED + '</b><span>Missed</span></button></div>';
  var rows = d.rows.filter(function (r) { return !S.ckStatus || r.status === S.ckStatus; });
  if (S.ckStatus) html += '<button class="linkish b sm" data-a="ckStatus" data-x="" style="margin:-4px 0 10px">Show all statuses</button>';
  if (!rows.length) {
    return html + (S.ckDate === todayYmd() && !S.ckStatus
      ? '<div class="empty"><div class="b">No checklist has opened yet today</div><div class="sm">Lunch opens at 12:00 PM, Dinner at 5:00 PM and Closing at 10:00 PM. Each one appears here when it opens.</div></div>'
      : '<div class="empty"><div class="b">Nothing to show</div><div class="sm">Try another date, restaurant or status.</div></div>');
  }
  return html + '<div class="items">' + rows.map(function (r) {
    var s = r.status === 'PENDING' && r.open ? 'OPEN' : r.status;
    var meta = r.submission
      ? 'by ' + r.submission.userName + ' at ' + clock(r.submission.submittedAt) + (r.submission.total != null ? ' · ' + r.submission.ticked + '/' + r.submission.total + ' ticked' : '') + (r.submission.photos ? ' · ' + plural(r.submission.photos, 'photo') : '')
      : r.status === 'MISSED' ? 'Closed at ' + clock(r.endsAt) + ' without a submission'
      : r.open ? 'Open now · closes ' + clock(r.endsAt) : 'Opens ' + when(r.startsAt);
    return '<button class="item' + (r.status === 'MISSED' ? ' bad' : '') + '"' + (r.submission ? ' data-a="ckRecord" data-x="' + r.submission.id + '"' : ' style="cursor:default"') + '>' +
      '<span class="tx"><span class="tt">' + h(r.restaurant) + ' · ' + h(r.label.replace(' Checklist', '')) + '</span>' +
      '<span class="mt" style="display:block">' + h(dayLabel(r.date)) + ' · ' + h(meta) + '</span></span><span class="rt">' + ckBadge(s) + '</span></button>';
  }).join('') + '</div>';
}

var CKI_ERR = '';
function ckItemsManager() {
  var d = need('ckItems', '/api/checklists/items');
  var html = chips('ckMgrType', CK_TYPES, S.ckMgrType);
  if (!d || d._err) return html + loadingHtml(d, 'items');
  var list = d.items.filter(function (i) { return i.type === S.ckMgrType; });
  var ro = isReadOnly();
  html += '<div class="card" style="display:flex;align-items:center;gap:14px">' +
    '<div class="grow"><div class="b" style="font-size:17px">' + h(CHKW.byType(S.ckMgrType).label) + ' · ' + plural(list.length, 'item') + '</div>' +
    '<div class="sm muted">Tap <b>Required</b> or <b>Photo</b> to switch them on or off. Changes apply from the next submission.</div></div>' +
    (ro ? '' : '<button class="btn addbtn" data-a="ckAdd" aria-label="Add an item" title="Add an item">+</button>') + '</div>';
  if (!list.length) return html + '<div class="empty"><div class="b">No items yet</div><div class="sm">Tap + to add the first one.</div></div>';
  return html + '<div class="card pad0">' + list.map(function (it) {
    return '<div class="ckmgr"><div class="q">' + h(it.text) +
      '<div class="flags">' +
      '<button class="flag' + (it.required ? ' on' : '') + '" data-a="ckFlag" data-x="' + it.id + '" data-f="required"' + (ro ? ' disabled' : '') + '>' + (it.required ? '✓ ' : '') + 'Required</button>' +
      '<button class="flag' + (it.photoRequired ? ' on' : '') + '" data-a="ckFlag" data-x="' + it.id + '" data-f="photoRequired"' + (ro ? ' disabled' : '') + '>' + (it.photoRequired ? '✓ ' : '') + 'Photo</button>' +
      '</div></div>' +
      (ro ? '' : '<button class="ibtn" data-a="ckEdit" data-x="' + it.id + '" aria-label="Edit">' + ic('edit') + '</button>' +
        '<button class="ibtn del" data-a="ckDel" data-x="' + it.id + '" aria-label="Remove">' + ic('trash') + '</button>') +
      '</div>';
  }).join('') + '</div>';
}
function ckItemSheet(id) {
  var it = id ? (DATA.ckItems.items.filter(function (x) { return x.id === id; })[0]) : { text: '', required: true, photoRequired: false, type: S.ckMgrType };
  if (!it) return;
  openSheet(id ? 'Edit item' : 'Add to the ' + CHKW.byType(S.ckMgrType).label,
    '<div class="card">' + (CKI_ERR ? '<div class="formerr">' + h(CKI_ERR) + '</div>' : '') +
    '<label class="f"><span>What needs to be checked <b class="req">*</b></span><textarea class="inp" id="ci_text" maxlength="300" style="min-height:90px" placeholder="e.g. Fridge temperature is below 5°C">' + h(it.text) + '</textarea></label>' +
    '<div class="setrow" style="padding:10px 0"><div class="grow"><b>Required</b><span>Must be ticked before the checklist can be submitted</span></div>' +
    '<button class="switch' + (it.required ? ' on' : '') + '" id="ci_req" data-a="toggleSwitch" role="switch" aria-checked="' + it.required + '" aria-label="Required"></button></div>' +
    '<div class="setrow" style="padding:10px 0;border:0"><div class="grow"><b>Photo required</b><span>A photo must be added for this item</span></div>' +
    '<button class="switch' + (it.photoRequired ? ' on' : '') + '" id="ci_photo" data-a="toggleSwitch" role="switch" aria-checked="' + it.photoRequired + '" aria-label="Photo required"></button></div>' +
    '<button class="btn" data-a="ckSaveItem" data-x="' + (id || '') + '" style="margin-top:12px">' + (id ? 'Save changes' : 'Add item') + '</button></div>', 'ckItem');
  var t = document.getElementById('ci_text'); if (t) t.focus();
}
function ckSaveItem(id) {
  var body = {
    text: val('ci_text'),
    required: document.getElementById('ci_req').classList.contains('on'),
    photoRequired: document.getElementById('ci_photo').classList.contains('on')
  };
  if (!body.text.trim()) { CKI_ERR = 'Enter what needs to be checked.'; ckItemSheet(id); return; }
  var p = id ? Api.patch('/api/checklists/items/' + id, body) : Api.post('/api/checklists/items', Object.assign({ type: S.ckMgrType }, body));
  p.then(function () { CKI_ERR = ''; closeSheet(); forget('ckItems'); paint(); toast(id ? 'Item saved' : 'Item added'); },
    function (err) { CKI_ERR = err.message; ckItemSheet(id); });
}
function ckFlag(id, field) {
  var it = DATA.ckItems.items.filter(function (x) { return x.id === id; })[0]; if (!it) return;
  var patch = {}; patch[field] = !it[field];
  it[field] = !it[field]; paint();
  Api.patch('/api/checklists/items/' + id, patch).then(function () { stale('ckItems'); }, function (err) {
    it[field] = !it[field]; paint(); showNotice('Not saved', h(err.message));
  });
}
</script>
<script>
/* =====================================================================
   LABELING
   User: create a label for their restaurant (name, prepared, expiry,
   photo, notes). Admin: every restaurant's labels and their expiry.
   ===================================================================== */
function labelsUrl(forAdmin) {
  if (!forAdmin) return '/api/labels';
  var q = [];
  if (S.labLoc) q.push('loc=' + S.labLoc);
  if (S.labQ) q.push('q=' + encodeURIComponent(S.labQ));
  return '/api/labels' + (q.length ? '?' + q.join('&') : '');
}
function noteLabels(d) { if (d && d.expiringSoonHours) EXPIRING_HOURS = d.expiringSoonHours; }
function countLabels(list) {
  var c = { ACTIVE: 0, EXPIRING: 0, EXPIRED: 0 };
  list.forEach(function (l) { c[labelStatus(l)]++; });
  return c;

function notifPermission() { return typeof Notification === 'undefined' || !navigator.serviceWorker ? 'unsupported' : Notification.permission; }
function alertsOn() {
  var pref = 'on'; try { pref = localStorage.getItem(ALERTS_KEY) || 'on'; } catch (e) { }

}

  if (alertsOn()) { setAlertsPref('off'); toast('Notifications off on this phone'); paint(); return; }

  if (S.audFrom) q.push('from=' + S.audFrom);

var POLL = null, REFRESH = null;
function startPolling() {
  stopPolling();
  pollNotifications();
  POLL = setInterval(pollNotifications, 20000);
  /* Keep what is on screen current: statuses, new tasks, expiry. Not while
     someone is typing in a field on the page itself. */
  REFRESH = setInterval(function () {
    if (!ME || ME.mustChange || document.hidden) return;
    var a = document.activeElement;
    if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#app').contains(a)) return;
    if (S.page === 'wipe' || S.page === 'audit' || S.page === 'settings') return;
    staleAll(); paint();
    if (sheetIs('label')) drawLabelSheet();
  }, 30000);
}
function stopPolling() { clearInterval(POLL); clearInterval(REFRESH); POLL = REFRESH = null; }
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && ME && !ME.mustChange) { pollNotifications(); staleAll(); paint(); }
});

/* Links: /#n=<notification id> from a phone notification; #task=, #label=,
   #checklist= and #chk=LUNCH for anything else that wants to point inside. */
var PENDING_LINK = null;
function readLink() {
  var m = /^#(n|task|label|checklist|chk)=([A-Za-z0-9-]+)$/.exec(location.hash || '');
  if (!m) return;
  PENDING_LINK = { kind: m[1], id: m[2] };
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
}
function followLink() {
  var l = PENDING_LINK; PENDING_LINK = null;
  if (!l || !ME || ME.mustChange) return;
  if (l.kind === 'n') {
    Api.get('/api/notifications?limit=100').then(function (d) {
      NOTIF.items = d.items; NOTIF.unread = d.unread; paintBell();
      openNotification(+l.id);
    });
  } else openLink({ task: 'task', label: 'label', checklist: 'checklist', chk: 'checklist-type' }[l.kind], l.id);
}

if (navigator.serviceWorker && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('/sw.js').catch(function () { });
  navigator.serviceWorker.addEventListener('message', function (e) {
    var url = String((e.data && e.data.url) || '');
    var i = url.indexOf('#');
    if (i > -1) {
      try { history.replaceState(null, '', location.pathname + url.slice(i)); } catch (err) { }
      readLink(); followLink();
    }
  });
}

readLink();
authShell('<div class="card center"><div class="sm muted">Signing you in…</div></div>');
Auth.boot(function () {
  S.page = homePage();
  render();
  if (ME && !ME.mustChange) { startPolling(); followLink(); }
});
</script>
